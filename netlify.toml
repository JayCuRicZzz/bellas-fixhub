[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Scheduled Functions (netlify/functions/*.mjs) — times are UTC
[functions."daily-summary"]
  schedule = "0 15 * * *"      # 22:00 Asia/Bangkok

[functions."pm-check"]
  schedule = "0 * * * *"       # hourly
